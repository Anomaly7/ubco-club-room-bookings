name: Refresh club room bookings

# The schedule is OFF: UBC's timetable is behind "UBC VPNLess Access" for cloud servers, so GitHub can't read it.
# Sam's PC runs scripts/publish.py every 10 minutes instead and pushes the data here. Manual runs stay possible.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Refresh the whole year"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh from the UBCO timetable
        run: python scripts/refresh.py ${{ (inputs.full) && '--full' || '' }}
      - name: Save changes
        run: |
          git config user.name "room-bookings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No booking changes."
          else
            git commit -m "Bookings update $(TZ=America/Vancouver date '+%Y-%m-%d %H:%M') Pacific"
            git push
          fi
